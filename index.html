<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CH144 Assignments</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --card-bg: #161b22;
            --border-color: #30363d;
            --chalk-color: rgba(255, 255, 255, 0.15);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* Chalkboard Background Formulas */
        .chalk-formula {
            position: absolute;
            font-family: "Courier New", Courier, monospace;
            font-weight: bold;
            color: var(--chalk-color);
            user-select: none;
            pointer-events: none;
            z-index: 1;
            font-style: italic;
        }

        .f1 { top: 10%; left: 10%; font-size: 1.5rem; transform: rotate(-5deg); }
        .f2 { top: 15%; right: 15%; font-size: 1.8rem; transform: rotate(8deg); }
        .f3 { bottom: 15%; left: 12%; font-size: 1.6rem; transform: rotate(12deg); }
        .f4 { bottom: 20%; right: 10%; font-size: 1.4rem; transform: rotate(-10deg); }
        .f5 { top: 45%; left: 5%; font-size: 1.3rem; transform: rotate(15deg); }
        .f6 { top: 50%; right: 5%; font-size: 1.7rem; transform: rotate(-7deg); }
        .f7 { top: 5%; left: 50%; transform: translateX(-50%) rotate(2deg); font-size: 1.4rem; }
        .f8 { bottom: 5%; left: 45%; font-size: 1.5rem; transform: rotate(-3deg); }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 700px;
            background-color: rgba(22, 27, 34, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            backdrop-filter: blur(4px);
            position: relative;
            z-index: 10;
        }

        .icon-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 1.5rem;
        }

        .chem-icon {
            fill: var(--accent-color);
            width: 60px;
            height: 60px;
            filter: drop-shadow(0 0 8px rgba(88, 166, 255, 0.3));
        }

        h1 {
            font-size: 2.5rem;
            margin: 0 0 0.5rem 0;
            color: #ffffff;
            letter-spacing: 1px;
            line-height: 1.2;
        }

        p {
            font-size: 1.2rem;
            color: #8b949e;
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <!-- Chalkboard Decorative Background Formulas -->
    <div class="chalk-formula f1">H₂O + CO₂ ⇌ H₂CO₃</div>
    <div class="chalk-formula f2">PV = nRT</div>
    <div class="chalk-formula f3">ΔG = ΔH - TΔS</div>
    <div class="chalk-formula f4">C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O</div>
    <div class="chalk-formula f5">pH = -log[H⁺]</div>
    <div class="chalk-formula f6">E = mc²</div>
    <div class="chalk-formula f7">CH₃COOH + H₂O ⇌ CH₃COO⁻ + H₃O⁺</div>
    <div class="chalk-formula f8">K_c = [C]^c[D]^d / ([A]^a[B]^b)</div>

    <div class="container">
        <!-- Chemistry Iconography (SVG Beaker & Atom) -->
        <div class="icon-container">
            <!-- Beaker -->
            <svg class="chem-icon" viewBox="0 0 24 24">
                <path d="M19 19c0 1.1-.9 2-2 2H7c-1.1 0-2-.9-2-2V9c0-.69.28-1.32.73-1.77L9 3V1.5c0-.28.22-.5.5-.5h5c.28 0 .5.22.5.5V3l3.27 4.23c.45.45.73 1.08.73 1.77v10zm-2-3l-3-4H10l-3 4v3h10v3z"/>
            </svg>
            <!-- Atom -->
            <svg class="chem-icon" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 12 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L11 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
            </svg>
        </div>

        <h1>CH144 Assignments</h1>
        <p>Instructor: Ian J MacDonald PhD</p>
    </div>

</body>
</html>
